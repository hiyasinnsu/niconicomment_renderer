<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニコニコメント合成</title>
<meta name="description" content="コメント増量で保存したニコニコ動画のコメントJSONを、手元の動画に合成して書き出すブラウザアプリ">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23252525'/%3E%3Cpath d='M6 11h20M4 17h16M9 23h18' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
      <path d="M6 8.5h10M5 12h12M8 15.5h10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
    <h1>ニコニコメント合成</h1>
  </div>
  <p class="lead">ブラウザ内だけで処理し、動画にコメントを合成してMP4を書き出します</p>
</header>

<main class="layout">
  <section class="player-col">
    <div class="files">
      <label class="file-pick" id="videoPick">
        <input type="file" id="videoInput" accept="video/*,.mkv,.mov">
        <span class="file-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        </span>
        <span class="file-meta">
          <span class="file-title">動画ファイル</span>
          <span class="file-name" id="videoName">未選択（ドロップ可）</span>
        </span>
      </label>
      <label class="file-pick" id="commentPick">
        <input type="file" id="commentInput" accept=".json,.xml,application/json,text/xml" multiple>
        <span class="file-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h14M4 12h16M7 18h13"/></svg>
        </span>
        <span class="file-meta">
          <span class="file-title">コメントファイル</span>
          <span class="file-name" id="commentName">未選択（JSON / XML 複数可）</span>
        </span>
      </label>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <video id="video" playsinline preload="auto"></video>
        <canvas id="overlay"></canvas>
        <div class="stage-empty" id="stageEmpty">
          <div class="empty-inner">
            <svg class="empty-mark" viewBox="0 0 120 68" width="120" height="68" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="118" height="66" rx="6" stroke="currentColor" stroke-opacity="0.22" stroke-width="1"/>
              <path d="M20 18h46M46 31h54M16 44h38M60 52h36" stroke="currentColor" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p class="empty-title">動画とコメントファイルを選ぶとプレビューを表示します</p>
            <p class="empty-sub">クリックして動画を選択、またはウィンドウへドラッグ＆ドロップ</p>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="playBtn" class="icon-btn" aria-label="再生" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="playIcon" d="M6 4l13 8-13 8z"/></svg>
      </button>
      <span class="time" id="timeLabel">0:00 / 0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置" disabled>
      <div class="vol-wrap">
        <svg class="vol-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input type="range" id="volume" min="0" max="1" value="0.8" step="0.05" aria-label="音量" class="vol">
      </div>
      <button type="button" id="fullBtn" class="icon-btn" aria-label="全画面">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="player-meta">
      <p class="status" id="status" role="status"></p>
      <p class="shortcuts" aria-label="キーボードショートカット">
        <span><kbd>Space</kbd> 再生</span>
        <span><kbd>←</kbd><kbd>→</kbd> 5秒</span>
      </p>
    </div>
  </section>

  <aside class="settings">
    <details open>
      <summary>
        <span>表示</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="details-body">
        <div class="field-row">
          <div class="field range">
            <label for="fontScale"><span>コメントの大きさ</span><span class="val"><output data-for="fontScale"></output>%</span></label>
            <input type="range" id="fontScale" min="50" max="150" step="5">
          </div>
          <div class="field range">
            <label for="opacity"><span>不透明度</span><span class="val"><output data-for="opacity"></output>%</span></label>
            <input type="range" id="opacity" min="0" max="100" step="5">
          </div>
        </div>
        <div class="field-row">
          <div class="field range">
            <label for="strokeAlpha"><span>縁取りの濃さ</span><span class="val"><output data-for="strokeAlpha"></output></span></label>
            <input type="range" id="strokeAlpha" min="0" max="1" step="0.05">
          </div>
          <div class="field range">
            <label for="strokeThickness"><span>縁取りの太さ</span><span class="val"><output data-for="strokeThickness"></output></span></label>
            <input type="range" id="strokeThickness" min="0" max="8" step="0.1">
          </div>
        </div>
        <div class="field range">
          <label for="fps"><span>フレームレート</span><span class="val"><output data-for="fps"></output>fps</span></label>
          <input type="range" id="fps" min="1" max="120" step="1">
        </div>
        <div class="field">
          <label for="font">フォント</label>
          <select id="font">
            <option value="default">標準（公式と同じ・OS別）</option>
            <option value="meiryo">メイリオ</option>
            <option value="custom">指定する</option>
          </select>
          <input type="text" id="customFont" placeholder='例: "BIZ UDPGothic", sans-serif' hidden>
        </div>
        <div class="check-group">
          <label class="check"><input type="checkbox" id="keepCA"><span>コメントアートが崩れないようにする</span></label>
          <label class="check"><input type="checkbox" id="showCount"><span>コメント描画数を表示</span></label>
        </div>
      </div>
    </details>

    <details open>
      <summary>
        <span>配置とタイミング</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="details-body">
        <div class="field">
          <label for="stageAspect">コメントの描画範囲</label>
          <select id="stageAspect">
            <option value="16:9">16:9（ニコニコと同じ・動画は中央収容）</option>
            <option value="video">動画の縦横比に合わせる</option>
          </select>
        </div>
        <div class="field">
          <label for="slotLimit">同時表示数の上限（レイヤーごと）</label>
          <select id="slotLimit">
            <option value="0">無制限（コメント増量向け）</option>
            <option value="40">40（ニコニコ公式と同じ）</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
        <div class="field">
          <label for="offsetSec">タイミング補正（秒・＋で遅らせる）</label>
          <input type="number" id="offsetSec" step="0.1">
        </div>
        <div class="check-group">
          <label class="check"><input type="checkbox" id="showOwner"><span>投稿者コメントを表示</span></label>
          <label class="check"><input type="checkbox" id="hideNicoscript"><span>投稿者のニコスクリプト（＠で始まる）を隠す</span></label>
        </div>
      </div>
    </details>

    <details>
      <summary>
        <span>NG・絞り込み</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="details-body">
        <div class="field">
          <label for="ngScore">NG共有レベル</label>
          <select id="ngScore">
            <option value="none">無</option>
            <option value="weak">弱</option>
            <option value="medium">中</option>
            <option value="strong">強</option>
            <option value="strongest">最強（スコア0未満すべて）</option>
          </select>
        </div>
        <div class="field">
          <label for="nicoruMin">ニコられ数の下限（以上を表示）</label>
          <input type="number" id="nicoruMin" min="0" step="1">
        </div>
        <div class="check-group">
          <label class="check"><input type="checkbox" id="premiumOnly"><span>プレミアム会員のコメントだけ表示</span></label>
          <label class="check"><input type="checkbox" id="hideEasy"><span>かんたんコメントを除外（API形式JSONのみ）</span></label>
        </div>
        <div class="field">
          <label for="ngWords">NGワード（1行に1つ）</label>
          <textarea id="ngWords" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="ngCommands">NGコマンド（1行に1つ・空白区切りでAND）</label>
          <textarea id="ngCommands" rows="2" placeholder="例: big red"></textarea>
        </div>
      </div>
    </details>

    <details open>
      <summary>
        <span>書き出し</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="details-body">
        <div class="field">
          <label for="outHeight">解像度（高さ）</label>
          <select id="outHeight">
            <option value="source">元の動画に合わせる</option>
            <option value="720">720p</option>
            <option value="1080">1080p</option>
            <option value="1440">1440p</option>
            <option value="2160">2160p</option>
          </select>
        </div>
        <div class="field">
          <label for="bitrate">映像ビットレート（Mbps・0で自動）</label>
          <input type="number" id="bitrate" min="0" step="1">
        </div>
        <div class="field">
          <label for="exportMode">方式</label>
          <select id="exportMode">
            <option value="webcodecs">高速（WebCodecs・MP4）</option>
            <option value="recorder">再生しながら録画（実時間）</option>
          </select>
        </div>
        <div class="check-group">
          <label class="check"><input type="checkbox" id="includeAudio"><span>音声を含める</span></label>
        </div>
        <p class="hint" id="exportInfo"></p>
        <div class="export-actions">
          <button type="button" id="exportBtn" class="primary" disabled>書き出す</button>
          <button type="button" id="cancelBtn" hidden>中止</button>
        </div>
        <progress id="exportProgress" max="1" value="0" hidden></progress>
        <p class="log" id="exportLog"></p>
      </div>
    </details>

    <div class="settings-foot">
      <button type="button" id="resetBtn" class="link-btn">設定を初期値に戻す</button>
    </div>
  </aside>
</main>

<footer class="foot">
  <p>公式視聴ページの描画処理に準拠 ・ 書き出しは Chrome / Edge を推奨</p>
  <p><a href="https://github.com/hiyasinnsu/niconicomment_renderer">ソースコード</a></p>
</footer>

<script src="lib/mp4box.all.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
